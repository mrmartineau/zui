name: NPM Release

on:
  workflow_dispatch:
    inputs:
      skip_package_age:
        description: 'Bypass Aikido safe-chain minimum package age check'
        type: boolean
        default: false

jobs:
  release:
    name: Release ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialise: each package's release commit + tag is pushed to main before the next
      # job checks out, avoiding non-fast-forward push races between the two releases.
      max-parallel: 1
      matrix:
        package: [zui, zui-theme]
    # Scope concurrency per package so re-runs of the same package queue, but the two
    # packages don't block each other across separate dispatches.
    concurrency: ${{ github.workflow }}-${{ matrix.package }}-${{ github.ref }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm trusted publishing (OIDC): pnpm swaps this for a short-lived publish token.
      # No NPM_TOKEN secret, so nothing expires and npm asks for no 2FA code.
      # Each package needs a trusted publisher on npmjs.com pointing at this workflow file.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Resolve main at job start rather than pinning github.sha, so the
          # second serialised matrix job sees the first job's release commit.
          ref: main
          fetch-depth: 0          # semantic-release needs full history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: 'pnpm'
      - name: Install safe-chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
      - run: pnpm install --frozen-lockfile ${{ inputs.skip_package_age && '--safe-chain-skip-minimum-package-age' || '' }}
      - name: Build @mrmartineau/zui
        if: matrix.package == 'zui'
        run: pnpm --filter @mrmartineau/zui run build
      - name: Release
        working-directory: packages/${{ matrix.package }}
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
