name: Deploy docs to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_package_age:
        description: 'Bypass Aikido safe-chain minimum package age check'
        type: boolean
        default: false
  # Called by release.yml after a release, so the changelog page shows the new version.
  workflow_call:
    inputs:
      skip_package_age:
        type: boolean
        default: false

# Coalesce rapid pushes; a newer commit cancels an in-flight deploy of an older one.
concurrency:
  # Fixed name: in a workflow_call run, github.workflow is the caller's name.
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs to Cloudflare Workers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Branch tip, not github.sha: after a release, that includes the release commit.
          ref: ${{ github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - name: Install safe-chain
        run: curl -fsSL https://github.com/AikidoSec/safe-chain/releases/latest/download/install-safe-chain.sh | sh -s -- --ci
      # inputs.skip_package_age is only set on manual dispatch; on push it's empty so the flag is omitted.
      - run: pnpm install --frozen-lockfile ${{ inputs.skip_package_age && '--safe-chain-skip-minimum-package-age' || '' }}
      # docs:build compiles @mrmartineau/zui first, then runs `astro build` (Cloudflare adapter)
      # into docs/dist, which wrangler.jsonc deploys as the Worker + static assets.
      - name: Build docs
        run: pnpm run docs:build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The Worker (wrangler.jsonc) lives in docs/, not the repo root.
          workingDirectory: docs
          packageManager: pnpm
          command: deploy
      # After the deploy, so the first deploy has created the D1 database (docs/wrangler.jsonc).
      # The API token needs Account > D1 > Edit on top of the deploy scope.
      - name: Push search index to D1
        run: pnpm --filter docs run search:push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
